appId: com.weatherts.app
productName: WeatherTS
artifactName: WeatherTS-Setup-${version}.${ext}
directories:
  output: release
files:
  - electron/**
  - dist/**
  - package.json
extraResources:
  - from: backend/dist/weatherts-backend.exe
    to: backend/weatherts-backend.exe
win:
  icon: build/icon.ico
  target: nsis
nsis:
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: true
  runAfterFinish: true
  installerLanguages:
    - pt_BR
    - en_US
  language: 1046
  include: build/installer.nsh
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: WeatherTS
  uninstallDisplayName: WeatherTS
asar: true
compression: maximum
electronDist: node_modules/electron/dist
publish:
  provider: github
  owner: pabloarzaosc
  repo: WeatherTS
  # Public repo, so the updater reads releases anonymously and NO credential is
  # shipped. Do not add `private: true` + `token` back unless the repo actually
  # goes private: that token is written verbatim into resources/app-update.yml
  # and is extractable from every installed copy.
  #
  # Releases must carry latest.yml alongside the .exe -- electron-updater reads
  # the version and sha512 from it and finds nothing without it. Publishing via
  # `electron-builder --publish always` uploads it automatically; a release
  # assembled by hand in the GitHub UI needs it attached explicitly.
