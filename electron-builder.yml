appId: com.weatherts.app
productName: WeatherTS
artifactName: WeatherTS-Setup-${version}.${ext}
directories:
  output: release
files:
  - electron/**
  - dist/**
  - package.json
extraResources:
  - from: backend/dist/weatherts-backend.exe
    to: backend/weatherts-backend.exe
win:
  icon: build/icon.ico
  target: nsis
nsis:
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: true
  runAfterFinish: true
  installerLanguages:
    - pt_BR
    - en_US
  language: 1046
  include: build/installer.nsh
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: WeatherTS
  uninstallDisplayName: WeatherTS
asar: true
compression: maximum
electronDist: node_modules/electron/dist
publish:
  provider: github
  owner: pabloarzaosc
  repo: WeatherTS
  # Private repo: electron-updater needs a token to read releases. It is read
  # from the environment AT BUILD TIME and written into resources/app-update.yml
  # inside the installer -- deliberately never hardcoded here, so no secret ever
  # lands in git. Build with WEATHERTS_UPDATE_TOKEN set or the updater ships
  # blind. Use a fine-grained, read-only, single-repo PAT: this value is
  # extractable from any installed copy of the app.
  private: true
  token: ${env.WEATHERTS_UPDATE_TOKEN}
